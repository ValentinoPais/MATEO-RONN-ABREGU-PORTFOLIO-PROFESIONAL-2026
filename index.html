    function logoClick(e) {
      e.preventDefault();
      // Si estamos al final de la página → subir arriba de todo.
      // Si no → bajar al final de todo (el footer/contacto).
      const doc = document.documentElement;
      const scrollY = window.scrollY || window.pageYOffset;
      const maxScroll = doc.scrollHeight - window.innerHeight;
      const atBottom = scrollY >= maxScroll - 4; // margen de 4px por redondeos
      // Salto: en el menú se marca directo la sección de destino (la primera si
      // subimos, la última si bajamos) sin "barrer" las del medio.
      const targets = navTargets();
      if (targets.length) startNavJump((atBottom ? targets[0] : targets[targets.length - 1]).id);
      window.scrollTo({ top: atBottom ? 0 : doc.scrollHeight, behavior: 'smooth' });
    }

    /* ─── Loguito: inclinación 3D EXAGERADA en hover + giro "moneda" al click ───
       El giro sale impulsado DESDE donde clickeás: si tocás el borde de abajo gira
       vertical, si tocás un costado gira lateral, en una esquina en diagonal.
       Perillas: HOVER_TILT / HOVER_LIFT / HOVER_POP (hover) y SPIN_MS / SPIN_TURNS (giro). */
    (function setupLogo() {
      const mark = document.getElementById('navLogoMark');
      const coin = mark && mark.querySelector('.coin');
      if (!coin) return;
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

      const HOVER_TILT = 30;   // inclinación máx. en hover (grados) — exagerado
      const HOVER_POP  = 1.16; // cuánto se agranda en hover (crece desde el centro)
      const SPIN_MS    = 340;  // duración del giro al click (un instante, bien rápido)
      const SPIN_TURNS = 1;    // vueltas completas por click

      const TR_FAST = 'transform .12s ease-out';                 // seguimiento ágil del mouse
      const TR_SLOW = 'transform .55s cubic-bezier(.2,.7,.3,1)'; // vuelta suave a neutro

      let hovering = false, spinning = false, tiltRX = 0, tiltRY = 0, raf = null, spinToken = 0;

      function renderTilt() {
        if (spinning) return;
        const pop = hovering ? HOVER_POP : 1;   // crece desde el centro (sin subir → no se escapa)
        coin.style.transform =
          'scale(' + pop + ') rotateX(' + tiltRX.toFixed(2) + 'deg) rotateY(' + tiltRY.toFixed(2) + 'deg)';
      }
      function setTilt(clientX, clientY) {
        const r = mark.getBoundingClientRect();
        const px = (clientX - r.left) / r.width;      // 0 (izq) .. 1 (der)
        const py = (clientY - r.top) / r.height;      // 0 (arriba) .. 1 (abajo)
        tiltRY = (px - 0.5) * 2 * HOVER_TILT;          // se inclina hacia el cursor/dedo
        tiltRX = -(py - 0.5) * 2 * HOVER_TILT;
        if (!raf) raf = requestAnimationFrame(function () { raf = null; renderTilt(); });
      }
      function onMove(e) { setTilt(e.clientX, e.clientY); }

      // Efectito de sonido en cada giro: lo elegido en #ajustes (ver CoinAudio más
      // arriba). Para que el PRIMER toque también suene, el audio se prende apenas
      // se apoya el mouse en la moneda (antes del click) o al pasar por encima si
      // ya hubo algún click en la página (antes de eso el navegador no deja).
      function playSpinSound() { CoinAudio.play(); }
      mark.addEventListener('pointerdown', function (e) {
        if (e.pointerType === 'mouse') CoinAudio.wake();
      });
      mark.addEventListener('pointerenter', function (e) {
        if (e.pointerType === 'mouse' && navigator.userActivation && navigator.userActivation.hasBeenActive) CoinAudio.wake();
      });

      // Golpe fuerte al principio que decae (easeOutQuint): casi toda la vuelta
      // pasa en el primer instante y después afloja y se asienta.
      function easeOutQuint(p) { return 1 - Math.pow(1 - p, 5); }

      function spinFrom(clientX, clientY) {
        playSpinSound();                          // sonidito con pitch random en cada giro
        const r = mark.getBoundingClientRect();   // el mark NO se transforma → centro estable
        let dx = (clientX - (r.left + r.width  / 2)) / (r.width  / 2);   // -1 (izq) .. 1 (der)
        let dy = (clientY - (r.top  + r.height / 2)) / (r.height / 2);   // -1 (arriba) .. 1 (abajo)
        if (Math.hypot(dx, dy) < 0.18) { dx = 1; dy = 0; }              // click al centro → lateral por defecto
        // Eje perpendicular al punto tocado, orientado para "empujar" ese punto hacia adentro.
        const ax = -dy, ay = dx;
        const total = 360 * SPIN_TURNS;
        const myToken = ++spinToken;
        spinning = true;
        coin.style.transition = 'none';
        const t0 = performance.now();
        function frame(now) {
          if (myToken !== spinToken) return;                            // otro click más nuevo tomó el control
          const p = Math.min(1, (now - t0) / SPIN_MS);
          const e = easeOutQuint(p);
          const ang = total * e;
          const pop = 1 + 0.16 * Math.sin(Math.PI * e);                 // "pop" desde el centro al pasar de canto
          coin.style.transform = 'scale(' + pop.toFixed(3) + ') rotate3d(' + ax.toFixed(3) + ',' + ay.toFixed(3) + ',0,' + ang.toFixed(1) + 'deg)';
          if (p < 1) { requestAnimationFrame(frame); }
          else {
            spinning = false;
            // 1) A neutro SIN transición (para que NO "desgire" dando otra vuelta)...
            coin.style.transition = 'none';
            coin.style.transform = '';
            void coin.offsetWidth;                       // ...aplicado al instante.
            // 2) Reactivamos la transición y, si el mouse sigue encima, volvemos a
            //    agrandar la moneda: re-detecta el hover aunque el mouse esté quieto.
            coin.style.transition = hovering ? TR_FAST : TR_SLOW;
            renderTilt();
          }
        }
        requestAnimationFrame(frame);
      }

      // ── Click con MOUSE (PC): gira. Frenamos el click para que NO dispare el
      //    scroll del logo (logoClick): la moneda SOLO gira, no mueve la página.
      let lastTouchEnd = 0;
      mark.addEventListener('click', function (e) {
        e.preventDefault();
        e.stopPropagation();
        if (performance.now() - lastTouchEnd < 600) return;   // vino de un toque → lo maneja touchend
        spinFrom(e.clientX, e.clientY);
      });

      // ── TÁCTIL (celu): lo mismo que el hover del mouse pero con el dedo.
      //    Mantener el dedo = se agranda y sigue el dedo; soltar = vuelve;
      //    un toque corto = gira (como el click en la PC).
      if ('ontouchstart' in window || navigator.maxTouchPoints > 0) {
        let tStart = 0, tX = 0, tY = 0, tMoved = false;
        mark.addEventListener('touchstart', function (e) {
          const t = e.touches[0];
          tStart = performance.now(); tX = t.clientX; tY = t.clientY; tMoved = false;
          if (!spinning) { hovering = true; coin.style.transition = TR_FAST; setTilt(t.clientX, t.clientY); }
        }, { passive: true });
        mark.addEventListener('touchmove', function (e) {
          const t = e.touches[0];
          if (Math.abs(t.clientX - tX) > 8 || Math.abs(t.clientY - tY) > 8) tMoved = true;
          if (!spinning) { setTilt(t.clientX, t.clientY); e.preventDefault(); }  // no scrollear mientras se juega con la moneda
        }, { passive: false });
        mark.addEventListener('touchend', function (e) {
          e.preventDefault();                                  // evita el click emulado (giro doble / scroll)
          lastTouchEnd = performance.now();
          const quickTap = (performance.now() - tStart < 300) && !tMoved;
          hovering = false;
          if (quickTap) {
            spinFrom(tX, tY);                                  // toque corto → gira desde donde tocaste
          } else {                                             // fue "mantener" → soltar y volver a neutro
            if (raf) { cancelAnimationFrame(raf); raf = null; }
            tiltRX = 0; tiltRY = 0;
            coin.style.transition = TR_SLOW;
            renderTilt();
          }
        }, { passive: false });
        mark.addEventListener('touchcancel', function () {
          hovering = false; tiltRX = 0; tiltRY = 0;
          if (raf) { cancelAnimationFrame(raf); raf = null; }
          coin.style.transition = TR_SLOW; renderTilt();
        }, { passive: true });
      }

      // ── Inclinación siguiendo el MOUSE: solo en dispositivos con mouse.
      if (window.matchMedia('(hover: none)').matches) return;
      mark.addEventListener('mouseenter', function () { hovering = true; coin.style.transition = TR_FAST; renderTilt(); });
      mark.addEventListener('mousemove', onMove);
      mark.addEventListener('mouseleave', function () {
        hovering = false; tiltRX = 0; tiltRY = 0;
        if (raf) { cancelAnimationFrame(raf); raf = null; }
        coin.style.transition = TR_SLOW;
        renderTilt();
      });
    })();

    function toggleMenu() {
      document.getElementById('mobileMenu').classList.toggle('open');
    }

    /* ════════════════════════════════════════════════════════════
       LIGHTBOX — navega SOLO las imágenes del artista/producción
       que se clickeó, e incluye un filmstrip de miniaturas.
       ════════════════════════════════════════════════════════════ */
    let lbImages = [], lbIndex = 0, lbCurrentArtist = null;
    const track = () => document.getElementById('lb-track');
    const imgC  = () => document.getElementById('lightboxImg');
    const imgL  = () => document.getElementById('lb-img-left');
    const imgR  = () => document.getElementById('lb-img-right');
    const lbLoader = () => document.getElementById('lbLoader');

    // Set de URLs que YA se vieron cargadas y decodificadas al menos una vez.
    // Si una imagen está acá, casi seguro vuelve de la caché al instante: se
    // muestra sin ocultar, así VOLVER a una foto ya vista no parpadea. El
    // precargado de vecinos va "calentando" este set (ir a la siguiente fluye).
    // Igual se verifica que el <img> la tenga lista de verdad (lbIsReady).
    let lbDecoded = new Set();

    const lbAbsUrl = (src) => { try { return new URL(src, location.href).href; } catch (e) { return src; } };

    // ¿Este <img> YA MUESTRA `src`, entera? No alcanza con .complete/.naturalWidth:
    // en FIREFOX, al cambiarle el src a un <img> que ya mostraba una foto, la
    // nueva queda "pendiente" y se sigue viendo la VIEJA hasta que la nueva baja
    // entera (mientras tanto naturalWidth y currentSrc son los de la vieja).
    // Por eso también se compara currentSrc (la foto que realmente se ve).
    function lbIsReady(imgEl, src) {
      if (!imgEl.complete || !imgEl.naturalWidth) return false;
      return imgEl.currentSrc === undefined || imgEl.currentSrc === lbAbsUrl(src);
    }

    // Spinner — REGLA: si el slot que se está MOSTRANDO está "cargando" (oculto),
    // se ve el ícono de carga; la pantalla nunca queda en negro pelado ni con la
    // foto anterior. Si la imagen ya está lista, no se muestra nada. Se re-evalúa
    // cada vez que cambia el slot mostrado o un slot termina de cargar.
    // Es puramente visual (pointer-events: none).
    let lbShownImg = null;
    // Circulito de carga: arranca cuando la foto que se MUESTRA empieza a cargar,
    // el arco avanza rápido y cada vez más lento (nunca llega solo al final), y
    // cuando la foto ya está lista completa la vuelta "de una" y desaparece
    // mientras aparece la foto. Si la foto llega enseguida (caché), ni se muestra.
    const LbBar = (() => {
      let active = false, completing = false, p = 0, t0 = 0, last = 0, raf = 0, showTimer = 0;
      const bar = () => lbLoader();
      const RING = 62.832;                                           // largo de la vuelta (2·π·10)
      const paint = () => { const f = bar() && bar().querySelector('.lb-ring-fill'); if (f) f.style.strokeDashoffset = (RING * (1 - p)).toFixed(3); };
      function frame(now) {
        const dt = Math.min(100, now - last);
        last = now;
        if (completing) {
          p += (1 - p) * (1 - Math.exp(-dt / 45));
          if (1 - p < 0.005) {
            p = 1; paint();
            if (bar()) bar().classList.remove('show');
            active = completing = false;
            raf = 0;
            return;
          }
        } else {
          p = Math.max(p, 0.9 * (1 - Math.exp(-(now - t0) / 1100)));
        }
        paint();
        raf = requestAnimationFrame(frame);
      }
      return {
        start() {
          if (!bar()) return;
          active = true; completing = false; p = 0;
          t0 = last = performance.now();
          paint();
          clearTimeout(showTimer);
          showTimer = setTimeout(() => { if (active && !completing && bar()) bar().classList.add('show'); }, 120);
          if (!raf) raf = requestAnimationFrame(frame);
        },
        done() {
          if (!active || !bar()) return;
          clearTimeout(showTimer);
          if (!bar().classList.contains('show')) {        // fue tan rápido que ni llegó a verse
            active = false; cancelAnimationFrame(raf); raf = 0;
            return;
          }
          completing = true;
          if (!raf) { last = performance.now(); raf = requestAnimationFrame(frame); }
        },
        hide() {
          active = completing = false;
          clearTimeout(showTimer);
          cancelAnimationFrame(raf); raf = 0;
          if (bar()) bar().classList.remove('show');
        },
      };
    })();
    let lbBarFor = null;   // la foto (src) cuyo progreso está mostrando la barrita
    function lbSyncLoader() {
      if (!lbLoader()) return;
      const el = lbShownImg;
      const loading = !!(el && el.getAttribute('src') && el.classList.contains('lb-img-loading'));
      if (loading) {
        const key = el.getAttribute('src');
        if (lbBarFor !== key) { lbBarFor = key; LbBar.start(); }   // otra foto: arranca de cero
      } else if (lbBarFor) {
        lbBarFor = null;
        LbBar.done();
      }
    }
    function lbWatchLoading(imgEl) {
      lbShownImg = imgEl || null;
      lbSyncLoader();
    }

    // Deja el slot oculto ("cargando") y lo revela cuando ESTE <img> terminó de
    // cargar `src` (evento load) y la decodificó. Cancela la espera anterior del
    // mismo slot, así navegar rápido no mezcla fotos.
    //  ⚠ No se usa img.decode() apenas se cambia el src: en Firefox esa promesa
    //    se resuelve AL INSTANTE contra la foto VIEJA (la nueva sigue pendiente),
    //    y por eso en Firefox se veía la foto anterior y el spinner no aparecía.
    //    Después del load sí es confiable (ya decodifica la foto nueva).
    function lbWaitFor(imgEl, src) {
      if (imgEl._lbStop) imgEl._lbStop();
      imgEl.classList.add('lb-img-loading');
      let done = false, safety = 0;
      const stop = () => {
        done = true;
        clearTimeout(safety);
        imgEl.removeEventListener('load', onLoad);
        imgEl.removeEventListener('error', onError);
        if (imgEl._lbStop === stop) imgEl._lbStop = null;
      };
      const reveal = (ok) => {
        if (done) return;
        stop();
        if (imgEl.getAttribute('src') !== src) return;
        if (ok) lbDecoded.add(src);
        imgEl.classList.remove('lb-img-loading');
        lbSyncLoader();
      };
      const onLoad = () => {
        // Un 'load' atrasado de la foto anterior no cuenta (.complete sigue en false).
        if (done || imgEl.getAttribute('src') !== src || !imgEl.complete || !imgEl.naturalWidth) return;
        imgEl.removeEventListener('load', onLoad);
        if (!imgEl.decode) return reveal(true);
        safety = setTimeout(() => reveal(true), 1500);   // por si decode() nunca responde
        imgEl.decode().then(() => reveal(true), () => reveal(false));
      };
      const onError = () => { if (!done && imgEl.getAttribute('src') === src) reveal(false); };
      imgEl._lbStop = stop;
      imgEl.addEventListener('load', onLoad);
      imgEl.addEventListener('error', onError);
      if (lbIsReady(imgEl, src)) onLoad();   // ya estaba en caché (p. ej. la portada de la grilla)
    }

    // Asigna el src de un slot y decide cómo mostrarlo:
    //  • Mismo src (slot ya precargado al que navegamos): no se reasigna → no
    //    re-decodifica ni parpadea.
    //  • Imagen ya vista (en lbDecoded): se muestra SIN ocultar, porque vuelve de
    //    la caché al instante → volver a una foto anterior no parpadea. Antes de
    //    pintar se confirma que de verdad esté; si no (la caché la descartó), se
    //    trata como nueva.
    //  • Primera vez: se oculta al instante (nunca se ve la foto anterior) y se
    //    revela recién cuando está cargada y DECODIFICADA. Mientras tanto el slot
    //    queda "cargando" y lo cubre el spinner — nunca negro pelado.
    function lbLoad(imgEl, src) {
      if (!imgEl) return;
      src = src || '';

      if (imgEl.getAttribute('src') === src) {
        if (src && lbIsReady(imgEl, src)) imgEl.classList.remove('lb-img-loading');
        return;
      }

      if (imgEl._lbStop) imgEl._lbStop();   // la foto que esperaba este slot ya no importa

      if (!src) { imgEl.src = ''; imgEl.classList.remove('lb-img-loading'); return; }

      if (lbDecoded.has(src)) {
        imgEl.classList.remove('lb-img-loading');
        imgEl.src = src;
        if (lbIsReady(imgEl, src)) return;   // en caché: ya se ve la nueva
        // Todavía no la tiene: se revisa justo antes de pintar (requestAnimationFrame
        // corre antes del próximo cuadro, así que la foto vieja nunca llega a verse).
        requestAnimationFrame(() => {
          if (imgEl.getAttribute('src') !== src || lbIsReady(imgEl, src)) return;
          lbDecoded.delete(src);
          lbWaitFor(imgEl, src);
          lbSyncLoader();
        });
        return;
      }

      imgEl.classList.add('lb-img-loading'); // ocultar al instante (sin fundido)
      imgEl.src = src;
      lbWaitFor(imgEl, src);
    }

    function lbUpdateSlides() {
      lbLoad(imgC(), lbImages[lbIndex]);
      lbLoad(imgL(), lbImages[lbIndex - 1]);
      lbLoad(imgR(), lbImages[lbIndex + 1]);
      imgL().style.opacity = lbIndex > 0 ? '1' : '0';
      imgR().style.opacity = lbIndex < lbImages.length - 1 ? '1' : '0';
      document.getElementById('lbPrev').classList.toggle('hidden', lbIndex === 0);
      document.getElementById('lbNext').classList.toggle('hidden', lbIndex === lbImages.length - 1);
      lbUpdateFilmstripActive();
      lbWatchLoading(imgC());
    }

    function lbResetTrack(animate) {
      track().style.transition = animate ? 'transform 0.22s ease' : 'none';
      track().style.transform = 'translateX(-100vw)';
    }

    const isMobile = () => window.matchMedia('(pointer: coarse)').matches;

    function openArtistLightbox(artist) {
      LbZoom.reset(false);
      LbBar.hide();
      lbBarFor = null;
      lbImages = artist.images;
      lbIndex = 0;
      lbCurrentArtist = artist;
      document.getElementById('lbTitle').textContent = artist.name;
      lbUpdateSlides();
      lbBuildFilmstrip();
      lbResetTrack(false);
      const lb = document.getElementById('lightbox');
      lb.style.transform = '';
      lb.style.opacity = '';
      lb.classList.add('open');
      document.body.style.overflow = 'hidden';
      // Mobile: scroll background NOW while lightbox covers screen
      if (isMobile() && artist.cardEl) {
        artist.cardEl.scrollIntoView({ behavior: 'instant', block: 'center' });
      }
    }

    /* ─── Zoom de la foto ampliada ───
       · PC: ruedita del mouse (o pellizco del touchpad) → acerca/aleja hacia donde
         está el cursor, suave. Con zoom: arrastrar mueve la foto (con inercia) y
         un click vuelve al tamaño normal. Teclas: + / − / 0.
       · Celu: pinch (dos dedos) → zoom hacia el medio de los dedos, y se puede
         mover a la vez. Doble toque → acerca ahí / vuelve. Con zoom, un dedo mueve
         la foto. Si te pasás (muy chico o muy grande) rebota suave al soltar.
       · La foto nunca se "escapa": los bordes no pueden entrar en la pantalla
         (si es más chica que la pantalla, queda centrada).
       · Al acercar se pide la misma foto en más resolución, así se ve nítida.
       · Cambiar de foto, abrir otra o cambiar el tamaño de la ventana: vuelve a 1×. */
    const LbZoom = (() => {
      const MAX = 4, DOUBLE_TAP = 2.5;
      let s = 1, x = 0, y = 0;                 // zoom y corrimiento actuals (px)
      let base = null;                          // lugar de la foto sin zoom (px de pantalla)
      let anim = 0, wheelTarget = 1, wheelAnchor = null, ideal = null;
      let pan = null, pinch = null;
      const lbEl = () => document.getElementById('lightbox');
      const img = () => imgC();
      const view = () => { const l = lbEl(); return { w: l.clientWidth || innerWidth, h: l.clientHeight || innerHeight }; };
      const clampNum = (v, a, b) => Math.min(b, Math.max(a, v));

      function ready() {                        // hay foto lista y no está pasando de una a otra
        const im = img();
        return !!(im && im.naturalWidth && !im.classList.contains('lb-img-loading') && !lbNavTimeout);
      }
      function measure() {
        const im = img();
        const prev = im.style.transform;
        im.style.transform = '';
        const r = im.getBoundingClientRect();
        im.style.transform = prev;
        base = { left: r.left, top: r.top, width: r.width, height: r.height };
        return base.width > 0 && base.height > 0;
      }
      // Hasta dónde se puede correr la foto en un eje, con zoom sc:
      //  · más grande que la pantalla → sus bordes no pueden entrar en la pantalla;
      //  · más chica → puede ir hacia donde apunta el zoom, sin salirse de la pantalla,
      //    pero cuanto más cerca de 1×, menos (en 1× queda exactamente centrada).
      function axisRange(start, size0, sc, vsize) {
        const size = size0 * sc, center = size0 * (1 - sc) / 2;
        if (size > vsize) return [vsize - start - size, -start];
        const lo = -start, hi = vsize - start - size, fit = vsize / size0;
        const k = fit > 1 ? Math.min(1, Math.max(0, (sc - 1) / (fit - 1))) : 1;
        return [center + (Math.min(lo, center) - center) * k, center + (Math.max(hi, center) - center) * k];
      }
      function limits(sc) {
        const v = view();
        return { x: axisRange(base.left, base.width, sc, v.w), y: axisRange(base.top, base.height, sc, v.h) };
      }
      function rubber(v, lo, hi) {              // pasarse del borde cuesta (efecto elástico)
        if (v < lo) return lo - (lo - v) * 0.35;
        if (v > hi) return hi + (v - hi) * 0.35;
        return v;
      }
      function apply() {
        const im = img();
        if (!im) return;
        const zoomed = s > 1.001;
        im.style.transform = zoomed || Math.abs(x) > 0.5 || Math.abs(y) > 0.5
          ? `translate3d(${x.toFixed(2)}px, ${y.toFixed(2)}px, 0) scale(${s.toFixed(4)})` : '';
        lbEl().classList.toggle('lb-zoomed', zoomed);
        if (s > 1.35) hiRes();
      }
      function stop() { cancelAnimationFrame(anim); anim = 0; wheelAnchor = null; ideal = null; }
      // Acerca/aleja manteniendo quieto el punto de la foto que está en (px, py).
      function scaleAround(s2, px, py) {
        const ux = (px - base.left - x) / s, uy = (py - base.top - y) / s;
        s = s2;
        x = px - base.left - ux * s;
        y = py - base.top - uy * s;
      }
      // Animación suave hasta (s2, x2, y2).
      function tweenTo(s2, x2, y2, ms) {
        stop();
        const s0 = s, x0 = x, y0 = y, t0 = performance.now();
        const step = (now) => {
          const k = Math.min(1, (now - t0) / ms), e = 1 - Math.pow(1 - k, 3);
          s = s0 + (s2 - s0) * e; x = x0 + (x2 - x0) * e; y = y0 + (y2 - y0) * e;
          apply();
          anim = k < 1 ? requestAnimationFrame(step) : 0;
        };
        anim = requestAnimationFrame(step);
      }
      // Estado válido más cercano (zoom entre 1 y MAX, bordes adentro), mirando a (px, py).
      function settle(px, py, ms) {
        const v = view();
        const cs = s, cx = x, cy = y;
        const s2 = clampNum(s, 1, MAX);
        scaleAround(s2, px === undefined ? v.w / 2 : px, py === undefined ? v.h / 2 : py);
        const L = limits(s2);
        const x2 = clampNum(x, L.x[0], L.x[1]), y2 = clampNum(y, L.y[0], L.y[1]);
        s = cs; x = cx; y = cy;
        tweenTo(s2, x2, y2, ms || 260);
      }
      let hiFor = null;
      function hiRes() {                        // la misma foto en más resolución (una vez por foto)
        const im = img(), src = im && im.getAttribute('src');
        if (!src || hiFor === src || !/sz=w\d+/.test(src)) return;
        const hi = driveThumbUrl(src, 3200);
        if (hi === src) return;
        hiFor = src;
        const pre = new Image();
        pre.src = hi;
        const swap = () => { const cur = img(); if (cur && cur.getAttribute('src') === src && s > 1.001) { cur.src = hi; lbDecoded.add(hi); } };
        (pre.decode ? pre.decode() : Promise.resolve()).then(swap, () => {});
      }

      return {
        isZoomed: () => s > 1.01,
        reset(animate) {
          stop(); pan = pinch = null; wheelTarget = 1;
          if (animate && base && s > 1.001) { tweenTo(1, 0, 0, 280); return; }
          s = 1; x = 0; y = 0;
          apply();
          base = null;
        },
        // ── ruedita (PC) ──
        wheel(e) {
          if (!ready()) return;
          const wheeling = !!wheelAnchor;            // ya hay un zoom de ruedita andando
          if (!wheeling) {
            stop();
            if (s <= 1.001 && !measure()) return;
            wheelTarget = s;
            ideal = { x, y };                        // posición "ideal" (sin recortar por los bordes)
          }
          const dy = e.deltaY * (e.deltaMode === 1 ? 16 : e.deltaMode === 2 ? view().h : 1);
          const k = e.ctrlKey ? 0.01 : 0.0022;       // pellizco del touchpad: más fino
          wheelTarget = clampNum(wheelTarget * Math.exp(-dy * k), 1, MAX);
          wheelAnchor = { x: e.clientX, y: e.clientY };
          if (wheeling) return;                      // el que ya anda toma el objetivo nuevo
          let last = performance.now();
          const step = (now) => {
            const dt = Math.min(64, now - last); last = now;
            let s2 = s + (wheelTarget - s) * (1 - Math.exp(-dt / 70));
            if (Math.abs(wheelTarget - s2) < 0.002) s2 = wheelTarget;
            // el punto bajo el cursor queda quieto (sobre la posición ideal, sin recortes acumulados)
            const ux = (wheelAnchor.x - base.left - ideal.x) / s, uy = (wheelAnchor.y - base.top - ideal.y) / s;
            s = s2;
            ideal.x = wheelAnchor.x - base.left - ux * s;
            ideal.y = wheelAnchor.y - base.top - uy * s;
            const L = limits(s);
            x = clampNum(ideal.x, L.x[0], L.x[1]);
            y = clampNum(ideal.y, L.y[0], L.y[1]);
            apply();
            if (Math.abs(wheelTarget - s) > 0.0005) anim = requestAnimationFrame(step);
            else { anim = 0; wheelAnchor = null; ideal = null; if (s <= 1.001) { s = 1; x = y = 0; apply(); } }
          };
          anim = requestAnimationFrame(step);
        },
        // ── arrastrar con zoom (mouse o un dedo) ──
        panStart(px, py) {
          if (!base) return;
          stop();
          pan = { px, py, x0: x, y0: y, pts: [{ t: performance.now(), px, py }] };
        },
        panMove(px, py) {
          if (!pan) return;
          const L = limits(s);
          x = rubber(pan.x0 + px - pan.px, L.x[0], L.x[1]);
          y = rubber(pan.y0 + py - pan.py, L.y[0], L.y[1]);
          const now = performance.now();
          pan.pts.push({ t: now, px, py });
          while (pan.pts.length > 2 && now - pan.pts[0].t > 90) pan.pts.shift();
          apply();
        },
        panEnd() {
          if (!pan) return;
          const a = pan.pts[0], b = pan.pts[pan.pts.length - 1], dt = Math.max(16, b.t - a.t);
          const vx = (b.px - a.px) / dt, vy = (b.py - a.py) / dt;     // px por ms
          pan = null;
          const fresh = performance.now() - b.t < 60;                  // si ya se había frenado, sin inercia
          // Adónde llega con la inercia; y si el zoom quedó pasado (pinch → un dedo), vuelve al tope.
          const cs = s, cx = x, cy = y, s2 = clampNum(s, 1, MAX);
          x += fresh ? vx * 220 : 0;
          y += fresh ? vy * 220 : 0;
          scaleAround(s2, b.px, b.py);
          const L = limits(s2);
          const x2 = clampNum(x, L.x[0], L.x[1]), y2 = clampNum(y, L.y[0], L.y[1]);
          s = cs; x = cx; y = cy;
          tweenTo(s2, x2, y2, fresh ? 420 : 260);
        },
        // ── pinch (celu) ──
        pinchStart(t1, t2) {
          if (!ready()) { pinch = null; return false; }
          stop(); pan = null;
          if (s <= 1.001 && !measure()) return false;
          pinch = { d0: Math.hypot(t1.clientX - t2.clientX, t1.clientY - t2.clientY) || 1,
                    mx: (t1.clientX + t2.clientX) / 2, my: (t1.clientY + t2.clientY) / 2, s0: s, x0: x, y0: y };
          return true;
        },
        pinchMove(t1, t2) {
          if (!pinch) return;
          const d = Math.hypot(t1.clientX - t2.clientX, t1.clientY - t2.clientY) || 1;
          const mx = (t1.clientX + t2.clientX) / 2, my = (t1.clientY + t2.clientY) / 2;
          let s2 = pinch.s0 * d / pinch.d0;
          if (s2 < 1) s2 = Math.max(0.6, 1 - (1 - s2) * 0.45);           // de más chico: cuesta
          if (s2 > MAX) s2 = MAX + (s2 - MAX) * 0.25;                     // de más grande: cuesta
          const ux = (pinch.mx - base.left - pinch.x0) / pinch.s0, uy = (pinch.my - base.top - pinch.y0) / pinch.s0;
          s = s2;
          x = mx - base.left - ux * s;                                    // lo que estaba entre los dedos sigue ahí
          y = my - base.top - uy * s;
          pinch.lx = mx; pinch.ly = my;
          apply();
        },
        pinchEnd(settleNow) {                                            // settleNow=false: queda un dedo apoyado
          if (!pinch) return;
          const px = pinch.lx !== undefined ? pinch.lx : pinch.mx, py = pinch.ly !== undefined ? pinch.ly : pinch.my;
          pinch = null;
          if (settleNow !== false) settle(px, py, 300);
        },
        settleNow() { if (base) settle(undefined, undefined, 280); },
        // ── doble toque / teclas ──
        toggleAt(px, py) {
          if (!ready()) return;
          if (s > 1.01) { tweenTo(1, 0, 0, 300); return; }
          if (!measure()) return;
          const cs = s, cx = x, cy = y;
          scaleAround(DOUBLE_TAP, px, py);
          const L = limits(DOUBLE_TAP);
          const x2 = clampNum(x, L.x[0], L.x[1]), y2 = clampNum(y, L.y[0], L.y[1]);
          s = cs; x = cx; y = cy;
          tweenTo(DOUBLE_TAP, x2, y2, 320);
        },
        stepAt(factor) {                                                  // teclas + / −
          if (!ready()) return;
          if (s <= 1.001 && !measure()) return;
          const v = view();
          const cs = s, cx = x, cy = y;
          const s2 = clampNum(s * factor, 1, MAX);
          scaleAround(s2, v.w / 2, v.h / 2);
          const L = limits(s2);
          const x2 = clampNum(x, L.x[0], L.x[1]), y2 = clampNum(y, L.y[0], L.y[1]);
          s = cs; x = cx; y = cy;
          tweenTo(s2, s2 <= 1.001 ? 0 : x2, s2 <= 1.001 ? 0 : y2, 240);
        },
        get panning() { return !!pan; },
      };
    })();

    window.addEventListener('resize', () => LbZoom.reset(false));

    let lbNavTimeout = null;

    function lbNavBtn(dir) {
      LbZoom.reset(false);                           // otra foto: sin zoom
      const next = Math.max(0, Math.min(lbImages.length - 1, lbIndex + dir));
      if (next === lbIndex) { lbResetTrack(true); return; }

      if (lbNavTimeout) {
        clearTimeout(lbNavTimeout);
        lbNavTimeout = null;
        track().style.transition = 'none';
        track().style.transform = 'translateX(-100vw)';
        // Update center to current lbIndex so no stale image appears
        lbLoad(imgC(), lbImages[lbIndex]);
      }

      if (dir > 0) { lbLoad(imgR(), lbImages[next]); imgR().style.opacity = '1'; lbWatchLoading(imgR()); }
      else         { lbLoad(imgL(), lbImages[next]); imgL().style.opacity = '1'; lbWatchLoading(imgL()); }

      lbIndex = next;
      document.getElementById('lbPrev').classList.toggle('hidden', lbIndex === 0);
      document.getElementById('lbNext').classList.toggle('hidden', lbIndex === lbImages.length - 1);
      lbUpdateFilmstripActive();

      requestAnimationFrame(() => {
        track().style.transition = 'transform 0.2s ease';
        track().style.transform = dir > 0 ? 'translateX(-200vw)' : 'translateX(0)';
      });

      lbNavTimeout = setTimeout(() => {
        lbUpdateSlides();
        lbResetTrack(false);
        lbNavTimeout = null;
      }, 200);
    }

    /* ─── Filmstrip de miniaturas ─── */
    function lbBuildFilmstrip() {
      const strip = document.getElementById('lb-filmstrip');
      lbStopFilmstripMotion();
      strip.innerHTML = '';
      strip.classList.remove('visible');
      if (lbImages.length <= 1) { strip.classList.add('hidden'); return; }
      strip.classList.remove('hidden');
      lbImages.forEach((src, i) => {
        const t = document.createElement('img');
        t.className = 'lb-thumb' + (i === lbIndex ? ' active' : '');
        t.src = driveThumbUrl(src, 200);
        t.alt = '';
        t.loading = 'lazy';
        t.draggable = false;   // que el arrastre con mouse deslice la tira, no "agarre" la foto
        t.addEventListener('click', e => {
          e.stopPropagation();
          lbJumpTo(i);
        });
        strip.appendChild(t);
      });
      requestAnimationFrame(lbScrollFilmstripToActive);
      // Animar: sube desde abajo con un pequeño rebote
      requestAnimationFrame(() => requestAnimationFrame(() => strip.classList.add('visible')));
    }

    function lbUpdateFilmstripActive() {
      const thumbs = document.querySelectorAll('#lb-filmstrip .lb-thumb');
      thumbs.forEach((t, i) => t.classList.toggle('active', i === lbIndex));
      lbScrollFilmstripToActive();
    }

    function lbScrollFilmstripToActive() {
      const active = document.querySelector('#lb-filmstrip .lb-thumb.active');
      if (!active) return;
      lbStopFilmstripMotion();   // corta la inercia/rueda para que no pelee con el centrado
      active.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
    }

    /* ─── Filmstrip con MOUSE (PC): se arrastra igual que con el dedo ───────
       En el celu el deslizado táctil es nativo. En la PC no había forma de
       moverlo (la barra está oculta a propósito), así que:
         • Mantener apretado y arrastrar → desliza; al soltar sigue con inercia.
         • Ruedita del mouse → desliza de costado.
       Un click corto (sin arrastrar) sigue eligiendo la miniatura, y soltar
       después de arrastrar NO elige foto ni cierra el lightbox.
       Solo actúa con mouse (pointerType 'mouse'): el touch sigue nativo. ─── */
    let lbStopFilmstripMotion = () => {};
    (function setupFilmstripMouse() {
      const strip = document.getElementById('lb-filmstrip');
      if (!strip) return;
      const DRAG_THRESHOLD = 6;   // px que hay que mover para que cuente como arrastre
      const FRICTION = 0.95;      // inercia al soltar (más cerca de 1 = desliza más lejos)
      const WHEEL_LINE_PX = 40;   // px por "línea" de rueda (Firefox a veces manda líneas)

      let pid = null, startX = 0, startLeft = 0, dragging = false, blockClick = false, blockTimer = 0;
      let lastX = 0, lastT = 0, vel = 0;                  // velocidad del arrastre (px/ms)
      let raf = 0, lastFrame = 0, pos = 0, glide = 0, wheelTarget = null, applied = 0;

      const maxScroll = () => Math.max(0, strip.scrollWidth - strip.clientWidth);
      const clamp = (v) => Math.max(0, Math.min(maxScroll(), v));

      function stopMotion() {
        if (raf) cancelAnimationFrame(raf);
        raf = 0; glide = 0; wheelTarget = null;
      }
      lbStopFilmstripMotion = stopMotion;

      // Un solo loop para la inercia del arrastre y el deslizado suave de la rueda.
      function frame(now) {
        // Si algo más movió la tira (touchpad, centrado automático), le cedemos el control.
        if (lastFrame && Math.abs(strip.scrollLeft - applied) > 1.5) { raf = 0; glide = 0; wheelTarget = null; return; }
        const dt = lastFrame ? Math.min(50, now - lastFrame) : 16.7;
        lastFrame = now;
        if (wheelTarget !== null) {
          pos += (wheelTarget - pos) * Math.min(1, 0.22 * dt / 16.7);
          if (Math.abs(wheelTarget - pos) < 0.5) { pos = wheelTarget; wheelTarget = null; }
        } else if (glide) {
          pos += glide * dt;
          glide *= Math.pow(FRICTION, dt / 16.7);
          if (Math.abs(glide) < 0.02) glide = 0;
        }
        const c = clamp(pos);
        if (c !== pos) { pos = c; glide = 0; if (wheelTarget !== null) wheelTarget = clamp(wheelTarget); }
        strip.scrollLeft = pos;
        applied = strip.scrollLeft;   // lo que quedó de verdad (el navegador redondea)
        raf = (glide || wheelTarget !== null) ? requestAnimationFrame(frame) : 0;
      }
      function startLoop() {
        if (!raf) { lastFrame = 0; raf = requestAnimationFrame(frame); }
      }

      // Cualquier click nuevo arranca "limpio" (nunca se bloquea un click legítimo).
      window.addEventListener('pointerdown', () => { blockClick = false; }, true);

      strip.addEventListener('pointerdown', e => {
        if (e.pointerType !== 'mouse' || e.button !== 0 || maxScroll() <= 0) return;
        stopMotion();
        pid = e.pointerId;
        startX = lastX = e.clientX;
        lastT = performance.now();
        vel = 0;
        startLeft = strip.scrollLeft;
        dragging = false;
      });

      window.addEventListener('pointermove', e => {
        if (e.pointerId !== pid) return;
        const dx = e.clientX - startX;
        if (!dragging) {
          if (Math.abs(dx) < DRAG_THRESHOLD) return;       // todavía puede ser un click
          dragging = true;
          strip.classList.add('dragging');
          try { strip.setPointerCapture(pid); } catch (err) {}
        }
        strip.scrollLeft = startLeft - dx;
        const now = performance.now(), dt = now - lastT;
        if (dt > 0) vel = 0.8 * ((lastX - e.clientX) / dt) + 0.2 * vel;
        lastX = e.clientX;
        lastT = now;
      });

      function endDrag(e) {
        if (e.pointerId !== pid) return;
        pid = null;
        if (!dragging) return;                               // fue un click: lo maneja la miniatura
        dragging = false;
        strip.classList.remove('dragging');
        // El click que dispara el navegador al soltar no debe elegir foto ni cerrar.
        blockClick = true;
        clearTimeout(blockTimer);
        blockTimer = setTimeout(() => { blockClick = false; }, 400);
        // Inercia: si soltaste en movimiento sigue deslizando y frena sola.
        if (e.type === 'pointercancel' || performance.now() - lastT > 90) vel = 0;
        if (Math.abs(vel) > 0.05) { pos = strip.scrollLeft; glide = vel; startLoop(); }
      }
      window.addEventListener('pointerup', endDrag);
      window.addEventListener('pointercancel', endDrag);

      window.addEventListener('click', e => {
        if (!blockClick) return;
        blockClick = false;
        e.stopPropagation();
        e.preventDefault();
      }, true);

      // Ruedita vertical → desliza la tira de costado. Los gestos horizontales
      // del touchpad (y Shift+rueda) quedan nativos; Ctrl+rueda sigue siendo zoom.
      strip.addEventListener('wheel', e => {
        if (e.ctrlKey || maxScroll() <= 0) return;
        if (Math.abs(e.deltaX) >= Math.abs(e.deltaY)) return;
        let d = e.deltaY;
        if (e.deltaMode === 1) d *= WHEEL_LINE_PX;
        else if (e.deltaMode === 2) d *= strip.clientWidth;
        e.preventDefault();
        glide = 0;
        if (wheelTarget === null) pos = strip.scrollLeft;
        wheelTarget = clamp((wheelTarget === null ? pos : wheelTarget) + d);
        startLoop();
      }, { passive: false });
    })();

    function lbJumpTo(i) {
      if (i === lbIndex || lbNavTimeout) return;
      LbZoom.reset(false);
      lbIndex = i;
      lbUpdateSlides();
      lbResetTrack(false);
    }

    function flashLastCard() {
      if (!lbCurrentArtist || !lbCurrentArtist.cardEl) return;
      const item = lbCurrentArtist.cardEl;
      item.classList.remove('lb-flash');
      void item.offsetWidth; // force reflow to restart animation
      item.classList.add('lb-flash');
      setTimeout(() => item.classList.remove('lb-flash'), 900);
    }

    function closeLightbox(fromSwipe) {
      const lb = document.getElementById('lightbox');
      document.body.style.overflow = '';
      if (!fromSwipe) {
        lb.style.transition = 'opacity 0.18s ease';
        lb.style.opacity = '0';
        setTimeout(() => {
          lb.classList.remove('open');
          lb.style.opacity = '';
          lb.style.transition = '';
          flashLastCard();
        }, 180);
      }
    }

    document.getElementById('lightbox').addEventListener('click', e => {
      if (LbZoom.isZoomed()) return;
      if (e.target === document.getElementById('lightbox') && !document.getElementById('lightbox').style.cursor) closeLightbox();
    });

    document.addEventListener('keydown', e => {
      if (!document.getElementById('lightbox').classList.contains('open')) return;
      if (e.key === 'Escape') { if (LbZoom.isZoomed()) LbZoom.reset(true); else closeLightbox(); }   // con zoom: primero vuelve
      if (e.key === 'ArrowLeft') lbNavBtn(-1);
      if (e.key === 'ArrowRight') lbNavBtn(1);
      if (e.key === '+' || e.key === '=') LbZoom.stepAt(1.5);
      if (e.key === '-' || e.key === '_') LbZoom.stepAt(1 / 1.5);
      if (e.key === '0') LbZoom.reset(true);
    });

    // ─── Protección de imágenes ───
    // Bloquea clic derecho sobre cards y lightbox
    document.addEventListener('contextmenu', e => {
      if (e.target.closest('.artist-card, .lightbox')) e.preventDefault();
    });
    // Bloquea drag (arrastrar imagen al escritorio o a otra pestaña)
    document.addEventListener('dragstart', e => {
      if (e.target.tagName === 'IMG') e.preventDefault();
    });

    // ─── Mouse (PC): arrastrar = cambiar de foto / cerrar; con zoom, mover la foto ───
    (function() {
      const lb = document.getElementById('lightbox');
      let startX = 0, startY = 0, axis = null, dragging = false, moved = false;
      let zoomPan = false, zMoved = false;

      lb.addEventListener('mousedown', e => {
        if (e.button !== 0) return;
        if (e.target.closest('.lightbox-zone') || e.target.closest('.lightbox-close') || e.target.closest('#lb-filmstrip')) return;
        startX = e.clientX;
        startY = e.clientY;
        e.preventDefault();
        if (LbZoom.isZoomed()) {                       // con zoom: arrastrar mueve la foto
          zoomPan = true; zMoved = false;
          LbZoom.panStart(e.clientX, e.clientY);
          lb.classList.add('lb-panning');
          return;
        }
        dragging = true;
        moved = false;
        axis = null;
        track().style.transition = 'none';
        lb.style.transition = 'none';
        lb.style.cursor = 'grabbing';
      });

      window.addEventListener('mousemove', e => {
        if (zoomPan) {
          if (Math.abs(e.clientX - startX) + Math.abs(e.clientY - startY) > 4) zMoved = true;
          LbZoom.panMove(e.clientX, e.clientY);
          return;
        }
        if (!dragging) return;
        const dx = e.clientX - startX;
        const dy = e.clientY - startY;
        if (!axis && (Math.abs(dx) > 5 || Math.abs(dy) > 5)) {
          axis = Math.abs(dx) > Math.abs(dy) ? 'x' : 'y';
          moved = true;
        }
        if (axis === 'x') {
          const atEdge = (lbIndex === 0 && dx > 0) || (lbIndex === lbImages.length - 1 && dx < 0);
          if (!atEdge) track().style.transform = `translateX(calc(-100vw + ${dx}px))`;
        } else if (axis === 'y') {
          lb.style.transform = `translateY(${dy}px)`;
          lb.style.opacity = Math.max(0, 1 - Math.abs(dy) / 300);
        }
      });

      window.addEventListener('mouseup', e => {
        if (zoomPan) {
          zoomPan = false;
          lb.classList.remove('lb-panning');
          if (zMoved) LbZoom.panEnd();
          else LbZoom.reset(true);                     // click con zoom: vuelve al tamaño normal
          return;
        }
        if (!dragging) return;
        dragging = false;
        lb.style.cursor = '';
        const dx = e.clientX - startX;
        const dy = e.clientY - startY;
        if (axis === 'x' && Math.abs(dx) > window.innerWidth * 0.15) {
          lbNavBtn(dx < 0 ? 1 : -1);
        } else if (axis === 'y' && Math.abs(dy) > 100) {
          document.body.style.overflow = '';
          lb.style.transition = 'transform 0.18s ease, opacity 0.18s ease';
          lb.style.transform = `translateY(${dy > 0 ? '100vh' : '-100vh'})`;
          lb.style.opacity = '0';
          setTimeout(() => {
            lb.classList.remove('open');
            lb.style.transform = '';
            lb.style.opacity = '';
            lb.style.transition = '';
            flashLastCard();
          }, 180);
        } else {
          lb.style.transition = 'transform 0.2s ease, opacity 0.2s ease';
          lb.style.transform = '';
          lb.style.opacity = '';
          lbResetTrack(true);
          if (!moved) closeLightbox();
        }
        moved = false;
        axis = null;
      });

      // Ruedita: zoom hacia el cursor (el filmstrip tiene su propia ruedita).
      lb.addEventListener('wheel', e => {
        if (!lb.classList.contains('open') || e.target.closest('#lb-filmstrip')) return;
        e.preventDefault();
        LbZoom.wheel(e);
      }, { passive: false });
    })();

    // ─── Touch (celu): swipe horizontal = cambiar de foto, vertical = cerrar;
    //     dos dedos = zoom; con zoom, un dedo mueve la foto; doble toque = zoom / volver;
    //     un toque (sin zoom) = cerrar, como antes (espera un instante por si es doble).
    (function() {
      const lb = document.getElementById('lightbox');
      let mode = null;                 // 'swipe' | 'pan' | 'pinch' | 'none'
      let ignore = false, startX = 0, startY = 0, axis = null, moved = false, tapZone = null;
      let lastTap = { t: 0, x: 0, y: 0 }, tapTimer = 0;

      const undoSwipe = () => {        // si un swipe venía empezado, vuelve todo a su lugar
        lb.style.transition = 'transform 0.2s ease, opacity 0.2s ease';
        lb.style.transform = '';
        lb.style.opacity = '';
        lbResetTrack(true);
        axis = null;
      };
      const onTap = (t) => {
        const now = performance.now();
        if (now - lastTap.t < 300 && Math.hypot(t.clientX - lastTap.x, t.clientY - lastTap.y) < 40) {
          clearTimeout(tapTimer);
          lastTap.t = 0;
          LbZoom.toggleAt(t.clientX, t.clientY);       // doble toque
          return;
        }
        lastTap = { t: now, x: t.clientX, y: t.clientY };
        clearTimeout(tapTimer);
        if (!LbZoom.isZoomed()) {
          tapTimer = setTimeout(() => {
            if (lb.classList.contains('open') && !LbZoom.isZoomed() && !lbNavTimeout) closeLightbox();
          }, 300);
        }
      };

      lb.addEventListener('touchstart', e => {
        if (e.touches.length === 1) {
          ignore = !!(e.target.closest('#lb-filmstrip') || e.target.closest('.lightbox-close'));
          tapZone = e.target.closest('.lightbox-zone');   // flechas ‹ ›: un toque las usa; un swipe desde ahí igual swipea
        }
        if (ignore) return;
        if (e.touches.length >= 2) {                   // entra el segundo dedo: pellizco
          if (mode === 'swipe' && axis) undoSwipe();
          clearTimeout(tapTimer);
          moved = true;
          mode = LbZoom.pinchStart(e.touches[0], e.touches[1]) ? 'pinch' : 'none';
          return;
        }
        const t = e.touches[0];
        startX = t.clientX;
        startY = t.clientY;
        axis = null;
        moved = false;
        if (LbZoom.isZoomed()) {
          mode = 'pan';
          LbZoom.panStart(t.clientX, t.clientY);
        } else {
          mode = 'swipe';
          track().style.transition = 'none';
          lb.style.transition = 'none';
        }
      }, { passive: true });

      lb.addEventListener('touchmove', e => {
        if (ignore) return;
        e.preventDefault();            // bloquea el scroll del fondo y el zoom propio del navegador
        if (mode === 'pinch') { if (e.touches.length >= 2) LbZoom.pinchMove(e.touches[0], e.touches[1]); return; }
        const t = e.touches[0];
        const dx = t.clientX - startX;
        const dy = t.clientY - startY;
        if (Math.abs(dx) > 8 || Math.abs(dy) > 8) moved = true;
        if (mode === 'pan') { LbZoom.panMove(t.clientX, t.clientY); return; }
        if (mode !== 'swipe') return;
        if (!axis && (Math.abs(dx) > 8 || Math.abs(dy) > 8)) {
          axis = Math.abs(dx) > Math.abs(dy) ? 'x' : 'y';
        }
        if (axis === 'x') {
          const atEdge = (lbIndex === 0 && dx > 0) || (lbIndex === lbImages.length - 1 && dx < 0);
          if (!atEdge) track().style.transform = `translateX(calc(-100vw + ${dx}px))`;
        } else if (axis === 'y') {
          lb.style.transform = `translateY(${dy}px)`;
          lb.style.opacity = Math.max(0, 1 - Math.abs(dy) / 300);
        }
      }, { passive: false });

      const onEnd = (e, cancelled) => {
        if (ignore) { if (!e.touches.length) ignore = false; return; }
        if (mode === 'pinch' || mode === 'none') {
          if (e.touches.length === 1) {                // queda un dedo
            const t = e.touches[0];
            if (mode === 'pinch') LbZoom.pinchEnd(false);
            startX = t.clientX; startY = t.clientY;
            if (LbZoom.isZoomed()) { mode = 'pan'; LbZoom.panStart(t.clientX, t.clientY); }   // sigue moviendo; al soltar se acomoda
            else { mode = 'none'; LbZoom.settleNow(); }   // quedó chica: vuelve a 1× (y no arranca un swipe a mitad de gesto)
          } else if (!e.touches.length) {
            if (mode === 'pinch') LbZoom.pinchEnd();
            mode = null;
          }
          return;
        }
        if (e.touches.length) return;
        const t = e.changedTouches[0];
        if (mode === 'pan') {
          mode = null;
          LbZoom.panEnd();
          if (!moved && !cancelled) { e.preventDefault(); onTap(t); }
          return;
        }
        if (mode !== 'swipe') { mode = null; return; }
        mode = null;
        if (!moved) {
          undoSwipe();
          if (tapZone || cancelled) return;                    // toque en una flecha: la maneja su propio click
          e.preventDefault();                                  // evita el click "fantasma" del navegador
          onTap(t);
          return;
        }
        const dx = t.clientX - startX;
        const dy = t.clientY - startY;
        if (axis === 'x' && !cancelled) {
          if (Math.abs(dx) > window.innerWidth * 0.25) {
            lbNavBtn(dx < 0 ? 1 : -1);
          } else {
            lbResetTrack(true);
          }
        } else if (axis === 'y' && Math.abs(dy) > 100 && !cancelled) {
          document.body.style.overflow = '';
          lb.style.transition = 'transform 0.18s ease, opacity 0.18s ease';
          lb.style.transform = `translateY(${dy > 0 ? '100vh' : '-100vh'})`;
          lb.style.opacity = '0';
          setTimeout(() => {
            lb.classList.remove('open');
            lb.style.transform = '';
            lb.style.opacity = '';
            flashLastCard();
          }, 180);
        } else {
          undoSwipe();
        }
      };
      lb.addEventListener('touchend', e => onEnd(e, false), { passive: false });
      lb.addEventListener('touchcancel', e => onEnd(e, true), { passive: false });
      // iPhone viejo: su propio gesto de zoom de página, desactivado dentro del lightbox.
      lb.addEventListener('gesturestart', e => e.preventDefault());
    })();
  </script>

</body>
</html>
